# Clavis Classic (personal-classic) está CONGELADO.
# Se desactiva la sincronización automática contra upstream para preservar
# el comportamiento clásico de la barra (pastillas/pills) y banner de perfil.
# Los cambios de upstream se integran exclusivamente mediante cherry-pick selectivo.

name: Sync personal fork (Disabled for personal-classic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: echo "personal-classic está congelado. No se ejecuta sincronización automática."
